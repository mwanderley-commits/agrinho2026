<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agro Forte - Futuro Sustentável</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Agro Forte, Futuro Sustentável</h1>
    </header>

    <main>
        <p id="instructions">Clique nas plantas para colher de forma sustentável!</p>
        <div id="field">
            <div class="plant" data-grown="0"></div>
            <div class="plant" data-grown="0"></div>
            <div class="plant" data-grown="0"></div>
            <div class="plant" data-grown="0"></div>
            <div class="plant" data-grown="0"></div>
        </div>

        <p>Pontos: <span id="score">0</span></p>
        <button id="resetButton">Recomeçar</button>
    </main>

    <footer>
        <p>Promovendo o agro sustentável com diversão!</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
